name: Build NOVA Browser APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find and extract NOVA Browser ZIP
        shell: bash
        run: |
          set -e

          echo "=== Repository files ==="
          find . -maxdepth 3 -type f | sort

          ZIP_FILE=$(find . -type f -name "*.zip" \
            ! -path "./.git/*" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "ZIP found: $ZIP_FILE"

          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

          echo "=== Extracted files ==="
          find extracted -maxdepth 5 -type f | sort

      - name: Locate Android Gradle project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find extracted -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found."
            echo "settings.gradle or settings.gradle.kts is missing."
            exit 1
          fi

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify Android project
        shell: bash
        run: |
          set -e

          echo "=== Project directory ==="
          find "$PROJECT_DIR" -maxdepth 4 -type f | sort

          echo "=== settings.gradle ==="
          if [ -f "$PROJECT_DIR/settings.gradle" ]; then
            cat "$PROJECT_DIR/settings.gradle"
          elif [ -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            cat "$PROJECT_DIR/settings.gradle.kts"
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] &&
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle or app/build.gradle.kts not found."
            exit 1
          fi

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=== Gradle version ==="
          gradle --version

          echo "=== Building NOVA Browser ==="
          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "=== APK files ==="
          find "$PROJECT_DIR" -type f -name "*.apk" -print

          APK=$(find "$PROJECT_DIR" -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          mkdir -p release
          cp "$APK" release/NOVA-Browser-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-Browser-APK
          path: release/NOVA-Browser-debug.apk
          if-no-files-found: error
