name: Build NOVA Browser APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Extract project
        shell: bash
        run: |
          set -eux

          mkdir -p extracted

          ZIP_FILE=$(find . -type f -name "*.zip" \
            ! -path "./.git/*" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found."
            exit 1
          fi

          echo "ZIP: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d extracted

      - name: Find Android project
        shell: bash
        run: |
          set -eux

          SETTINGS=$(find extracted -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found."
            find extracted -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"

      - name: Check project
        shell: bash
        run: |
          set -eux

          cd "$PROJECT_DIR"

          echo "=== PROJECT ==="
          pwd

          echo "=== FILES ==="
          find . -maxdepth 4 -type f | sort

          echo "=== SETTINGS ==="
          cat settings.gradle 2>/dev/null || cat settings.gradle.kts

          echo "=== APP BUILD ==="
          cat app/build.gradle 2>/dev/null || cat app/build.gradle.kts

      - name: Check Java and Gradle
        shell: bash
        run: |
          java -version
          gradle --version

      - name: Build APK
        shell: bash
        run: |
          set -eux

          cd "$PROJECT_DIR"

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --info

      - name: Find APK
        shell: bash
        run: |
          set -eux

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not generated."
            exit 1
          fi

          mkdir -p release
          cp "$APK" release/NOVA-Browser-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-Browser-APK
          path: release/NOVA-Browser-debug.apk
          if-no-files-found: error
